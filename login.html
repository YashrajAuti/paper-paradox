<!DOCTYPE html>
<html lang="en" data-theme="dark">


<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Green CSE Paperless</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --green-dark: #1a5c2a;
            --green-mid: #2e7d32;
            --green-light: #4caf50;
            --green-accent: #66bb6a;
            --bg: #0d1117;
            --text-primary: #e6edf3;
            --text-muted: #8b949e;
            --card-bg: rgba(28, 34, 48, 0.6);
            --card-border: rgba(255, 255, 255, 0.1);
            --input-bg: #21262d;
            --input-border: #30363d;
        }


        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 15% 50%, rgba(76, 175, 80, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(102, 187, 106, 0.08), transparent 25%);
        }


        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }


        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }


        /* ── Role Tabs ── */
        .role-tabs {
            display: flex;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 28px;
            gap: 4px;
        }


        .role-tab {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }


        .role-tab.active {
            background: linear-gradient(135deg, var(--green-mid), var(--green-light));
            color: #fff;
            box-shadow: 0 3px 12px rgba(46, 125, 50, 0.4);
        }


        .role-tab:not(.active):hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }


        /* ── Auth Header ── */
        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }


        .auth-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--green-light), var(--green-accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }


        /* ── Form ── */
        .form-group { margin-bottom: 20px; }


        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }


        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }


        .form-input:focus {
            outline: none;
            border-color: var(--green-accent);
            box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.15);
        }


        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--green-mid), var(--green-light));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(46, 125, 50, 0.4);
            margin-top: 10px;
        }


        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.55);
        }


        /* ── Role badge on button ── */
        .btn-submit .role-hint {
            opacity: 0.85;
            font-weight: 500;
            font-size: 0.82rem;
            margin-left: 6px;
        }


        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }


        .auth-link {
            color: var(--green-accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }


        .auth-link:hover {
            color: var(--green-light);
            text-decoration: underline;
        }


        /* ── Flash messages ── */
        .flash-messages { margin-bottom: 20px; }


        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }


        .alert-error {
            background: rgba(248, 81, 73, 0.15);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.3);
        }


        .alert-success {
            background: rgba(63, 185, 80, 0.15);
            color: #3fb950;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }


        /* ── Teacher accent colour override ── */
        body.role-teacher .auth-title {
            background: linear-gradient(135deg, #42a5f5, #90caf9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        body.role-teacher .role-tab.active {
            background: linear-gradient(135deg, #1565c0, #42a5f5);
            box-shadow: 0 3px 12px rgba(21, 101, 192, 0.4);
        }


        body.role-teacher .form-input:focus {
            border-color: #42a5f5;
            box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
        }


        body.role-teacher .btn-submit {
            background: linear-gradient(135deg, #1565c0, #42a5f5);
            box-shadow: 0 4px 14px rgba(21, 101, 192, 0.4);
        }


        body.role-teacher .btn-submit:hover {
            box-shadow: 0 6px 20px rgba(21, 101, 192, 0.55);
        }


        body.role-teacher .auth-link { color: #42a5f5; }
        body.role-teacher .auth-link:hover { color: #90caf9; }
    </style>
</head>


<body>
    <div class="auth-container">


        <!-- Role Tab Selector -->
        <div class="role-tabs" role="tablist">
            <button class="role-tab active" id="tab-student" type="button"
                onclick="selectRole('student')" aria-selected="true">
                🎓 Student
            </button>
            <button class="role-tab" id="tab-teacher" type="button"
                onclick="selectRole('teacher')" aria-selected="false">
                👩‍🏫 Teacher
            </button>
        </div>


        <div class="auth-header">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle" id="auth-subtitle">Sign in as a Student</p>
        </div>


        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}


        <form method="POST" action="{{ url_for('login') }}">
            <!-- Hidden role field -->
            <input type="hidden" name="role" id="role-input" value="student" />


            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input"
                    placeholder="Enter your email" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input"
                    placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">
                Sign In <span class="role-hint" id="submit-hint">as Student</span>
            </button>
        </form>


        <div class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('signup') }}" class="auth-link">Create one</a>
        </div>
    </div>


    <script>
        function selectRole(role) {
            const isTeacher = role === 'teacher';


            // Update tabs
            document.getElementById('tab-student').classList.toggle('active', !isTeacher);
            document.getElementById('tab-teacher').classList.toggle('active',  isTeacher);


            // Update tab aria attributes
            document.getElementById('tab-student').setAttribute('aria-selected', String(!isTeacher));
            document.getElementById('tab-teacher').setAttribute('aria-selected', String(isTeacher));


            // Update hidden field
            document.getElementById('role-input').value = role;


            // Update text
            const label = isTeacher ? 'Teacher' : 'Student';
            const icon  = isTeacher ? '👩‍🏫' : '🎓';
            document.getElementById('auth-subtitle').textContent = `Sign in as a ${label}`;
            document.getElementById('submit-hint').textContent  = `as ${label}`;


            // Swap colour theme on body
            document.body.classList.toggle('role-teacher', isTeacher);
        }
    </script>
</body>


</html>
